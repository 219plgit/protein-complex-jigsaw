[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-complex-jigsaw"
version = "4.0.0"
description = "Protein Complex Jigsaw: typed-evidence reasoning for inspectable assembly, variant perturbation and misassembly"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Pietro Liò", email = "pl219@cam.ac.uk" },
  { name = "Maria Teresa Liò" },
]
keywords = ["structural bioinformatics", "protein complexes", "assembly", "variant interpretation", "misassembly"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.22",
  "pandas>=1.4",
  "matplotlib>=3.5",
  "networkx>=2.8",
  "biopython>=1.80",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
pcjigsaw-count   = "scijigsaw.cli:_assembly"
pcjigsaw-bench   = "scijigsaw.cli:_bench"
pcjigsaw-extract = "scijigsaw.cli:_extract"
pcjigsaw-render  = "scijigsaw.cli:_render"
pcjigsaw-tiles   = "scijigsaw.cli:_tiles"
pcjigsaw-variant = "pcjigsaw.cli:variant_main"

# Backward-compatible command aliases for existing users and old notebooks.
scijigsaw-count   = "scijigsaw.cli:_assembly"
scijigsaw-bench   = "scijigsaw.cli:_bench"
scijigsaw-extract = "scijigsaw.cli:_extract"
scijigsaw-render  = "scijigsaw.cli:_render"
scijigsaw-tiles   = "scijigsaw.cli:_tiles"

[project.urls]
Repository = "https://github.com/219plgit/protein-complex-jigsaw"
Issues     = "https://github.com/219plgit/protein-complex-jigsaw/issues"
Release    = "https://github.com/219plgit/protein-complex-jigsaw/releases/tag/v4.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
